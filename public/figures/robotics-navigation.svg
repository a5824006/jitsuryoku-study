<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#263d52"/></marker></defs><rect width="760" height="405" fill="#faf8f2"/><g font-family="sans-serif" font-size="17" fill="#263d52" stroke-linecap="round"><text x="25" y="30">移動ロボット：観測から行動までの閉ループ</text><rect x="30" y="55" width="330" height="55" rx="8" fill="#e9e4d6" stroke="#789882"/><text x="42" y="87">1. Sensing</text><rect x="395" y="55" width="330" height="55" rx="8" fill="#e9e4d6" stroke="#789882"/><text x="407" y="87">2. Information Extraction</text><rect x="30" y="145" width="330" height="55" rx="8" fill="#e9e4d6" stroke="#789882"/><text x="42" y="177">3. Localization / Map Building</text><rect x="395" y="145" width="330" height="55" rx="8" fill="#e9e4d6" stroke="#789882"/><text x="407" y="177">4. Cognition / Path Planning</text><rect x="30" y="235" width="330" height="55" rx="8" fill="#e9e4d6" stroke="#789882"/><text x="42" y="267">5. Path Execution</text><rect x="395" y="235" width="330" height="55" rx="8" fill="#e9e4d6" stroke="#789882"/><text x="407" y="267">6. Acting</text><text x="30" y="345">生データ → 局所地図 → 位置/大域地図 → 経路 → 指令 → 実世界</text><text x="30" y="375">行動した実世界を再びSensingで観測する。目標・命令は経路計画へ入力。</text></g></svg>