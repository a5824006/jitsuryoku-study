<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title"><title id="title">2022：提示3クラス図に合わせた注文単位</title>
<rect width="100%" height="100%" fill="#f9f7f2"/><g font-family="sans-serif" font-size="18" fill="#172b41">
<text x="30" y="32" font-size="23" font-weight="bold">2022：提示3クラス図に合わせた注文単位</text>
<path d="M280,175 L420,175" stroke="#526a7b" fill="none" stroke-width="2"/>
<text x="350.0" y="145.0" text-anchor="middle">購入</text>
<path d="M670,175 L810,175" stroke="#526a7b" fill="none" stroke-width="2"/>
<text x="740.0" y="145.0" text-anchor="middle">対象</text>
<rect x="30" y="100" width="250" height="112" rx="3" fill="white" stroke="#526a7b" stroke-width="2"/>
<text x="155.0" y="131" text-anchor="middle" font-weight="bold">顧客</text>
<path d="M30,145 H280" stroke="#526a7b"/>
<text x="42" y="172">氏名</text>
<text x="42" y="202">住所</text>
<rect x="420" y="100" width="250" height="112" rx="3" fill="white" stroke="#526a7b" stroke-width="2"/>
<text x="545.0" y="131" text-anchor="middle" font-weight="bold">注文</text>
<path d="M420,145 H670" stroke="#526a7b"/>
<text x="432" y="172">注文日</text>
<text x="432" y="202">数量</text>
<rect x="810" y="100" width="250" height="142" rx="3" fill="white" stroke="#526a7b" stroke-width="2"/>
<text x="935.0" y="131" text-anchor="middle" font-weight="bold">商品</text>
<path d="M810,145 H1060" stroke="#526a7b"/>
<text x="822" y="172">型番</text>
<text x="822" y="202">カテゴリ</text>
<text x="822" y="232">価格</text>
<text x="292" y="165" text-anchor="start">1</text>
<text x="408" y="165" text-anchor="end">0..*</text>
<text x="682" y="165" text-anchor="start">0..*</text>
<text x="798" y="165" text-anchor="end">1</text>
<text x="30" y="325" font-size="16">注文は「顧客1人が商品1種類を注文した明細単位」とする。</text>
<text x="30" y="355" font-size="16">原本の * を0..*と表示。複数商品を持つ注文全体の別モデルへ置き換えない。</text>
</g></svg>